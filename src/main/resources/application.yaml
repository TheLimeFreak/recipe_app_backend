spring:
  application:
    name: recipe
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recipe_app}
    username: ${DB_USERNAME:recipe_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    error:
      include-message: always
      include-binding-errors: always

